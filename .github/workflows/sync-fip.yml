---
name: Sync with fip.it and publish

on:
  schedule:
    # every 4 hours, off the hour to avoid the top-of-hour queue
    - cron: "17 */4 * * *"
    # game days: hourly on Sat/Sun; 15-23 UTC covers 17-24 Italian time in CEST and CET
    - cron: "47 15-23 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-fip
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run fip-calendar
      - name: Commit generated data if FIP data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain -- docs/data.json docs/calendario.ics)" ]; then
            echo "No changes from fip.it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/calendario.ics
          git commit -m "chore(data): sync with fip.it"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
